site_name: convomem-arena
site_description: A conversational-memory environment for models and personal assistants, built on verifiers v1.
site_url: https://rahmansunny071.github.io/convomem-arena/
repo_url: https://github.com/rahmansunny071/convomem-arena
repo_name: convomem-arena
docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/forum-outline
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/lede.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Documentation:
      - Overview: index.md
      - Get started:
          - Evaluate a model: getting-started/quickstart.md
          - Evaluate a personal assistant: getting-started/personal-assistant.md
      - Concepts:
          - verifiers, prime-envs and the Hub: concepts/verifiers.md
          - The dataset: concepts/dataset.md
          - How a task is built: concepts/tasks.md
          - Memory modes: concepts/memory-modes.md
          - Scoring: concepts/scoring.md
      - Quality:
          - Data quality: quality/data-quality.md
          - Judge robustness: quality/judge-robustness.md
  - Guides:
      - Running evaluations: guides/running-evaluations.md
      - Reading results: guides/reading-results.md
      - Use a Vellum assistant as the model: guides/vellum-as-model.md
  - Reference:
      - Configuration: reference/configuration.md
      - Architecture: reference/architecture.md
      - Development and testing: reference/development.md
      - Design decisions: reference/design-decisions.md
      - Limitations and caveats: reference/limitations.md
      - Troubleshooting: reference/troubleshooting.md
      - Changelog: reference/changelog.md
      - Citation and license: reference/citation-and-license.md
